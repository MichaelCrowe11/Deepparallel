[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepparallel"
version = "0.3.0"
description = "Deep Parallel: multi-path scientific reasoning toolkit + Phase-Ising optimizer"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Michael Crowe" }]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "numpy>=1.24",
  "fastapi>=0.104.1",
  "uvicorn>=0.24.0",
  "pydantic>=2.5.0",
  "ray[default]>=2.5.0",
  "psutil>=5.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]
triton = [
  "triton>=2.1",
]

[project.scripts]
deepparallel = "deepparallel.cli_simple:app"
dp-ising-opt = "deepparallel.optimizer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["deepparallel*"]

[tool.setuptools.package-data]
"deepparallel" = ["**/*.yaml"]
